name: GymTracker
options:
  bundleIdPrefix: com.monsoudzanaty
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  GymTracker:
    type: application
    platform: iOS
    sources:
      - path: GymTracker
      - path: Shared
    dependencies:
      - target: GymTrackerWidgets
    entitlements:
      path: GymTracker/GymTracker.entitlements
      properties:
        com.apple.security.application-groups: [group.com.monsoudzanaty.GymTracker]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: GymTracker/Info.plist
      properties:
        CFBundleDisplayName: GymTracker
        UILaunchScreen: {}
        NSCameraUsageDescription: Scan food barcodes to look them up in Open Food Facts.
        NSHealthShareUsageDescription: Reads heart rate variability and resting heart rate so a morning well below your usual can make today's lifts a little lighter, last night's sleep for the readiness check-in, and bodyweight for days you did not weigh in here. Each is read only after you turn it on in Settings.
        NSHealthUpdateUsageDescription: Saves each finished workout to Health as strength training, when turned on in Settings.
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.monsoudzanaty.GymTracker
            CFBundleURLSchemes: [gymtracker]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.monsoudzanaty.GymTracker
  GymTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GymTrackerWidgets
      - path: Shared
    entitlements:
      path: GymTrackerWidgets/GymTrackerWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.monsoudzanaty.GymTracker]
    info:
      path: GymTrackerWidgets/Info.plist
      properties:
        CFBundleDisplayName: GymTracker Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.monsoudzanaty.GymTracker.Widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        SKIP_INSTALL: "YES"
  GymTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GymTrackerTests
    dependencies:
      - target: GymTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monsoudzanaty.GymTrackerTests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  GymTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GymTrackerUITests
    dependencies:
      - target: GymTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monsoudzanaty.GymTrackerUITests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_TARGET_NAME: GymTracker
schemes:
  GymTracker:
    build:
      targets:
        GymTracker: all
        GymTrackerWidgets: all
        GymTrackerTests: [test]
        GymTrackerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [GymTrackerTests, GymTrackerUITests]
