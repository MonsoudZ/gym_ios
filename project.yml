name: GymTracker
options:
  bundleIdPrefix: com.monsoudzanaty
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  GymTracker:
    type: application
    platform: iOS
    sources:
      - path: GymTracker
    info:
      path: GymTracker/Info.plist
      properties:
        CFBundleDisplayName: GymTracker
        UILaunchScreen: {}
        NSCameraUsageDescription: Scan food barcodes to look them up in Open Food Facts.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.monsoudzanaty.GymTracker
  GymTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GymTrackerTests
    dependencies:
      - target: GymTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monsoudzanaty.GymTrackerTests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  GymTracker:
    build:
      targets:
        GymTracker: all
        GymTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [GymTrackerTests]
